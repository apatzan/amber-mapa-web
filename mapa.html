<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amber Real Estate</title>

    <link rel="stylesheet" href="css/styles.css">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Iconos -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <script src="js/auth.js"></script>
</head>

<body>

<header>

    <div class="logo">
        <img src="images/amber-360.jpeg" alt="Amber">
    </div>

    <nav>

        <a href="mapa.html">Inicio</a>
        <a href="contacto.html">Contacto</a>

    </nav>

    <div class="acciones">

        <span id="bienvenido" class="bienvenido">
            <i class="fa-solid fa-user"></i>
            <span id="bienvenido-texto"></span>
        </span>

        <!--
        <button>
            <i class="fa-solid fa-magnifying-glass"></i>
            Buscar
        </button>
        -->
        <button onclick="cerrarSesion()">
            <i class="fa-solid fa-right-from-bracket"></i>
            Salir
        </button>

    </div>

</header>


<section class="mapa">
    <div id="map"></div>
</section>

<div id="video-modal" class="video-modal" onclick="if(event.target === this) cerrarVideoModal()">
    <div class="video-modal-contenido">
        <button type="button" class="video-modal-cerrar" onclick="cerrarVideoModal()" aria-label="Cerrar video">&times;</button>
        <div class="video-modal-embed">
            <iframe id="video-modal-iframe" src="" title="Video de la propiedad" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen></iframe>
        </div>
    </div>
</div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([14.6349, -90.5069], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const countryStyle = {
            color: '#FA9E70',
            weight: 3,
            fillColor: '#d4af37',
            fillOpacity: 0.05
        };

        // Ícono de marcador al 50% del tamaño por defecto de Leaflet (25x41 -> 12.5x20.5)
        const iconoPropiedad = L.icon({
            iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
            iconRetinaUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
            shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
            iconSize: [12.5, 20.5],
            iconAnchor: [6, 20.5],
            popupAnchor: [0, -18],
            shadowSize: [20.5, 20.5]
        });

        Promise.all([
            fetch('data/guatemala.geojson').then(res => res.json()),
            fetch('data/el-salvador.geojson').then(res => res.json())
        ]).then(([guatemalaGeojson, elSalvadorGeojson]) => {
            const guatemalaLayer = L.geoJSON(guatemalaGeojson, { style: countryStyle }).addTo(map);
            const elSalvadorLayer = L.geoJSON(elSalvadorGeojson, { style: countryStyle }).addTo(map);

            const bounds = guatemalaLayer.getBounds().extend(elSalvadorLayer.getBounds());
            map.fitBounds(bounds);
        });

        function escapeHtml(value){
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function parseLatitud(raw){
            if(raw === null || raw === undefined) return null;

            let digits = String(raw).trim().replace(/[^\d.\-]/g, '');
            let num = parseFloat(digits);

            if(isNaN(num)) return null;

            // Algunos registros vienen sin el punto decimal (ej. "13583519" en vez de "13.583519")
            if(Math.abs(num) > 90){
                const sign = digits.startsWith('-') ? '-' : '';
                const onlyDigits = digits.replace('-', '');
                num = parseFloat(sign + onlyDigits.slice(0, 2) + '.' + onlyDigits.slice(2));
            }

            return (isNaN(num) || Math.abs(num) > 90) ? null : num;
        }

        function parseLongitud(raw){
            if(raw === null || raw === undefined) return null;

            const num = typeof raw === 'number'
                ? raw
                : parseFloat(String(raw).trim().replace(/[^\d.\-]/g, ''));

            return (isNaN(num) || Math.abs(num) > 180) ? null : num;
        }

        function normalizarUrl(valor){
            if(!valor) return null;

            const texto = String(valor).trim();
            if(!texto || texto === '-') return null;

            return /^https?:\/\//i.test(texto) ? texto : `https://${texto}`;
        }

        function obtenerYoutubeId(url){
            if(!url) return null;

            const texto = String(url).trim();
            if(!texto) return null;

            const match = texto.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/))([A-Za-z0-9_-]{11})/);
            return match ? match[1] : null;
        }

        function obtenerDriveId(url){
            if(!url) return null;

            const texto = String(url).trim();
            if(!texto) return null;

            const match = texto.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([A-Za-z0-9_-]+)/);
            return match ? match[1] : null;
        }

        function obtenerVideoEmbedUrl(url){
            const youtubeId = obtenerYoutubeId(url);
            if(youtubeId) return `https://www.youtube.com/embed/${youtubeId}?autoplay=1`;

            const driveId = obtenerDriveId(url);
            if(driveId) return `https://drive.google.com/file/d/${driveId}/preview`;

            return null;
        }

        function abrirVideoModal(embedUrl){
            document.getElementById('video-modal-iframe').src = embedUrl;
            document.getElementById('video-modal').classList.add('activo');
        }

        function cerrarVideoModal(){
            document.getElementById('video-modal').classList.remove('activo');
            document.getElementById('video-modal-iframe').src = '';
        }

        document.addEventListener('keydown', evento => {
            if(evento.key === 'Escape') cerrarVideoModal();
        });

        const EXTENSIONES_IMAGEN_PROPIEDAD = ['jpg', 'jpeg', 'png', 'webp'];

        function construirImagenPropiedad(codigo){
            const codigoSeguro = codigo ? String(codigo).trim() : '';
            if(!codigoSeguro) return '';

            const codigoEscapado = escapeHtml(codigoSeguro);
            return `<div class="popup-imagen"><img src="images/propiedades/${codigoEscapado}.${EXTENSIONES_IMAGEN_PROPIEDAD[0]}" data-codigo="${codigoEscapado}" data-ext-index="0" onerror="manejarErrorImagenPropiedad(this)"></div>`;
        }

        function manejarErrorImagenPropiedad(img){
            const siguienteIndex = Number(img.dataset.extIndex) + 1;

            if(siguienteIndex < EXTENSIONES_IMAGEN_PROPIEDAD.length){
                img.dataset.extIndex = siguienteIndex;
                img.src = `images/propiedades/${img.dataset.codigo}.${EXTENSIONES_IMAGEN_PROPIEDAD[siguienteIndex]}`;
                return;
            }

            img.closest('.popup-imagen')?.remove();
        }

        function construirPopup(propiedad){
            const campos = [
                ['Tipo de inmueble', propiedad.tipo_inmueble],
                ['Código', propiedad.codigo],
                ['Giro de negocio', propiedad.giro_negocio],
                ['País', propiedad.pais],
                ['Municipio', propiedad.municipio],
                ['Departamento', propiedad.departamento],
                ['Metros terreno', propiedad.metros_terreno],
                ['Varas terreno', propiedad.varas_terreno],
                ['Región', propiedad.region]
            ];

            const filas = campos
                .filter(([, valor]) => valor !== null && valor !== undefined && String(valor).trim() !== '')
                .map(([etiqueta, valor]) => `<li><strong>${escapeHtml(etiqueta)}:</strong> ${escapeHtml(valor)}</li>`)
                .join('');

            const planoUrl = normalizarUrl(propiedad.plano);
            const mapsUrl = normalizarUrl(propiedad.maps);
            const videoEmbedUrl = obtenerVideoEmbedUrl(propiedad.video);

            const botones = `
                <div class="popup-acciones">
                    ${planoUrl ? `<a href="${escapeHtml(planoUrl)}" target="_blank" rel="noopener noreferrer" class="popup-btn">Ubicación Específica</a>` : ''}
                    ${mapsUrl ? `<a href="${escapeHtml(mapsUrl)}" target="_blank" rel="noopener noreferrer" class="popup-btn">Ver en Maps</a>` : ''}
                </div>
                ${videoEmbedUrl ? `
                <div class="popup-acciones popup-acciones-video">
                    <button type="button" class="popup-btn popup-btn-video" onclick="abrirVideoModal('${videoEmbedUrl}')">Recorrido virtual</button>
                </div>` : ''}
            `;

            const imagenHtml = construirImagenPropiedad(propiedad.codigo);

            return `
                <div class="popup-propiedad">
                    ${imagenHtml}
                    <h3>${escapeHtml(propiedad.titulo || 'Propiedad')}</h3>
                    <ul>${filas}</ul>
                    ${botones}
                </div>
            `;
        }

        fetch('/api/propiedades')
            .then(res => res.json())
            .then(datos => {
                datos.propiedades.forEach(propiedad => {
                    const lat = parseLatitud(propiedad.latitud);
                    const lng = parseLongitud(propiedad.longitud);

                    if(lat === null || lng === null) return;

                    L.marker([lat, lng], { icon: iconoPropiedad })
                        .addTo(map)
                        .bindPopup(construirPopup(propiedad));
                });
            });
    </script>
</body>
</html>
