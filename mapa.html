<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amber Real Estate</title>

    <link rel="stylesheet" href="css/styles.css">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Iconos -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <script src="js/auth.js"></script>
</head>

<body>

<header>

    <div class="logo">
        <img src="images/amber-logo.jpeg" alt="Amber">
    </div>

    <nav>

        <a href="#">Inicio</a>
        <a href="#">Propiedades</a>
        <a href="#">Asesores</a>
        <a href="#">Contacto</a>

    </nav>

    <div class="acciones">

        <span id="bienvenido" class="bienvenido"></span>

        <button>
            <i class="fa-solid fa-magnifying-glass"></i>
            Buscar
            <button onclick="cerrarSesion()">                                                                                                                                                  
            <i class="fa-solid fa-right-from-bracket"></i>                                                                                                                                 
            Salir                                                                                                                                                                          
            </button>  
        </button>

    </div>

</header>


<section class="mapa">
    <div id="map"></div>
</section>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([14.6349, -90.5069], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const countryStyle = {
            color: '#FA9E70',
            weight: 3,
            fillColor: '#d4af37',
            fillOpacity: 0.05
        };

        // Ícono de marcador al 50% del tamaño por defecto de Leaflet (25x41 -> 12.5x20.5)
        const iconoPropiedad = L.icon({
            iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
            iconRetinaUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
            shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
            iconSize: [12.5, 20.5],
            iconAnchor: [6, 20.5],
            popupAnchor: [0, -18],
            shadowSize: [20.5, 20.5]
        });

        Promise.all([
            fetch('data/guatemala.geojson').then(res => res.json()),
            fetch('data/el-salvador.geojson').then(res => res.json())
        ]).then(([guatemalaGeojson, elSalvadorGeojson]) => {
            const guatemalaLayer = L.geoJSON(guatemalaGeojson, { style: countryStyle }).addTo(map);
            const elSalvadorLayer = L.geoJSON(elSalvadorGeojson, { style: countryStyle }).addTo(map);

            const bounds = guatemalaLayer.getBounds().extend(elSalvadorLayer.getBounds());
            map.fitBounds(bounds);
        });

        function escapeHtml(value){
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function parseLatitud(raw){
            if(raw === null || raw === undefined) return null;

            let digits = String(raw).trim().replace(/[^\d.\-]/g, '');
            let num = parseFloat(digits);

            if(isNaN(num)) return null;

            // Algunos registros vienen sin el punto decimal (ej. "13583519" en vez de "13.583519")
            if(Math.abs(num) > 90){
                const sign = digits.startsWith('-') ? '-' : '';
                const onlyDigits = digits.replace('-', '');
                num = parseFloat(sign + onlyDigits.slice(0, 2) + '.' + onlyDigits.slice(2));
            }

            return (isNaN(num) || Math.abs(num) > 90) ? null : num;
        }

        function parseLongitud(raw){
            if(raw === null || raw === undefined) return null;

            const num = typeof raw === 'number'
                ? raw
                : parseFloat(String(raw).trim().replace(/[^\d.\-]/g, ''));

            return (isNaN(num) || Math.abs(num) > 180) ? null : num;
        }

        function normalizarUrl(valor){
            if(!valor) return null;

            const texto = String(valor).trim();
            if(!texto || texto === '-') return null;

            return /^https?:\/\//i.test(texto) ? texto : `https://${texto}`;
        }

        function construirPopup(propiedad){
            const campos = [
                ['Tipo de inmueble', propiedad['Tipo inmueble']],
                ['Código', propiedad['Código']],
                ['Giro de negocio', propiedad['Giro de negocio']],
                ['País', propiedad['Pais ']],
                ['Municipio', propiedad['Municipio']],
                ['Departamento', propiedad['Departamento']],
                ['Metros terreno', propiedad['Metros Terreno']],
                ['Varas terreno', propiedad['Varas terreno']],
                ['Región', propiedad['Región']]
            ];

            const filas = campos
                .filter(([, valor]) => valor !== null && valor !== undefined && String(valor).trim() !== '')
                .map(([etiqueta, valor]) => `<li><strong>${escapeHtml(etiqueta)}:</strong> ${escapeHtml(valor)}</li>`)
                .join('');

            const fichaUrl = normalizarUrl(propiedad['Ficha']);
            const mapsUrl = normalizarUrl(propiedad['Maps']);

            const botones = `
                <div class="popup-acciones">
                    ${fichaUrl ? `<a href="${escapeHtml(fichaUrl)}" target="_blank" rel="noopener noreferrer" class="popup-btn">Ubicación Específica</a>` : ''}
                    ${mapsUrl ? `<a href="${escapeHtml(mapsUrl)}" target="_blank" rel="noopener noreferrer" class="popup-btn">Ver en Maps</a>` : ''}
                </div>
            `;

            return `
                <div class="popup-propiedad">
                    <h3>${escapeHtml(propiedad['Titulo'] || 'Propiedad')}</h3>
                    <ul>${filas}</ul>
                    ${botones}
                </div>
            `;
        }

        fetch('data/propiedades.json')
            .then(res => res.json())
            .then(propiedades => {
                propiedades.forEach(propiedad => {
                    const lat = parseLatitud(propiedad['Latitud']);
                    const lng = parseLongitud(propiedad['Longitud']);

                    if(lat === null || lng === null) return;

                    L.marker([lat, lng], { icon: iconoPropiedad })
                        .addTo(map)
                        .bindPopup(construirPopup(propiedad));
                });
            });
    </script>
</body>
</html>
